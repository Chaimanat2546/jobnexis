version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      RUN_MIGRATIONS: "1"
    depends_on:
      - pgsql

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "127.0.0.1:${PGADMIN_UI_PORT:-8081}:80"  # Fixed host port for Web UI
    depends_on:
      - pgsql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"    # Web UI

volumes:
  pgdata:
    driver: local
