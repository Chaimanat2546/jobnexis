version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      RUN_MIGRATIONS: "1"
      # Mailpit SMTP for outgoing mail
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: noreply@example.com
      MAIL_FROM_NAME: Laravel
    depends_on:
      - pgsql
      - mailpit

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1::1025"  # Random host port -> container 1025 (SMTP)
      - "127.0.0.1::8025"  # Random host port -> container 8025 (Web UI)

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "127.0.0.1::80"    # Random host port -> container 80 (Web UI)
    depends_on:
      - pgsql

volumes:
  pgdata:
    driver: local
